[project]
name = "bmgtnh-orchestrator"
version = "0.1.0"
description = "Headless test orchestration for the BlueMap GTNH port: server lifecycle, RCON, bmh harness scenes."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
orch = "orchestrator.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
